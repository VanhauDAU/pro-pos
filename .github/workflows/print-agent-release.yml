name: Print Agent Release

on:
  push:
    tags: ['print-agent-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $version = node -p "require('./apps/print-agent/package.json').version"
          if ($env:GITHUB_REF_NAME -ne "print-agent-v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $version"
          }
      - run: pnpm --filter @propos/print-agent typecheck
      - run: pnpm exec vitest run tests/unit/print-agent-job-queue.test.ts tests/unit/print-agent-shutdown-coordinator.test.ts tests/unit/print-agent-update-manager.test.ts tests/unit/print-agent.test.ts tests/unit/print-agent-runtime.test.ts tests/unit/print-agent-credential-store.test.ts tests/unit/print-agent-autostart.test.ts tests/unit/print-agent-presentation.test.ts
      - run: pnpm benchmark:print-agent
      - run: pnpm --filter @propos/print-agent dist:win
      - name: Verify Windows updater artifacts and invariants
        run: node scripts/verify-print-agent-update-artifacts.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: print-agent-windows-${{ github.run_id }}
          path: |
            apps/print-agent/release/*.exe
            apps/print-agent/release/*.blockmap
            apps/print-agent/release/latest.yml
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./apps/print-agent/package.json').version")
          test "$GITHUB_REF_NAME" = "print-agent-v$version"
      - run: pnpm --filter @propos/print-agent typecheck
      - run: pnpm exec vitest run tests/unit/print-agent-job-queue.test.ts tests/unit/print-agent-shutdown-coordinator.test.ts tests/unit/print-agent-update-manager.test.ts tests/unit/print-agent.test.ts tests/unit/print-agent-runtime.test.ts tests/unit/print-agent-credential-store.test.ts tests/unit/print-agent-autostart.test.ts tests/unit/print-agent-presentation.test.ts
      - run: pnpm benchmark:print-agent
      - run: pnpm --filter @propos/print-agent dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: print-agent-macos-${{ github.run_id }}
          path: |
            apps/print-agent/release/*.dmg
            apps/print-agent/release/*.zip
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: print-agent-*-${{ github.run_id }}
          path: apps/print-agent/release
          merge-multiple: true
      - name: Verify Windows updater artifacts before publish
        run: node scripts/verify-print-agent-update-artifacts.mjs
      - name: Publish Windows updater feed to Cloudflare R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || 'propos-updates' }}
          WORKER_URL: 'https://pro-pos-production.vanhau-laravel.workers.dev'
          CLOUDFLARE_R2_FEED_PREFIX: 'print-agent/windows/stable'
        run: node scripts/publish-print-agent-r2.mjs
      - run: node scripts/write-print-agent-checksums.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: print-agent-release-${{ github.run_id }}
          path: |
            apps/print-agent/release/*.exe
            apps/print-agent/release/*.blockmap
            apps/print-agent/release/latest.yml
            apps/print-agent/release/*.dmg
            apps/print-agent/release/*.zip
            apps/print-agent/release/SHA256SUMS.txt
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/print-agent/release/*.exe
            apps/print-agent/release/*.blockmap
            apps/print-agent/release/latest.yml
            apps/print-agent/release/*.dmg
            apps/print-agent/release/*.zip
            apps/print-agent/release/SHA256SUMS.txt
          generate_release_notes: true
