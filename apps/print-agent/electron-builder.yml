appId: com.propos.print-agent
productName: PRO POS Print Agent
directories:
  output: release
  buildResources: build
files:
  - dist/desktop/**
  - package.json
asarUnpack:
  - dist/desktop/resources/**
artifactBuildStarted: ./scripts/ensure-print-agent-macos-signature.cjs
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: PRO POS Print Agent
  uninstallDisplayName: PRO POS Print Agent
portable:
  artifactName: ${productName}-${version}-${arch}-Portable.${ext}
mac:
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.business
  darkModeSupport: true
  extendInfo:
    NSLocalNetworkUsageDescription: PRO POS Print Agent cần truy cập mạng nội bộ để kết nối và gửi dữ liệu tới máy in hóa đơn trong cửa hàng.
dmg:
  title: ${productName} ${version}
  artifactName: ${productName}-${version}-${arch}.${ext}
publish:
  provider: generic
  url: https://pro-pos-production.vanhau-laravel.workers.dev/api/v1/print-agent-updates/windows/stable/
