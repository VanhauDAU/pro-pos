openapi: 3.1.0
info:
  title: Pro POS API
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /auth/context:
    get:
      summary: Resolve user and device context from HttpOnly cookies
      responses:
        '200': { description: Context resolved }
  /auth/access/start:
    post:
      summary: Create one-time Access state and return the protected auth bridge URL
      responses:
        '200': { description: Access request created }
  /auth/access/complete:
    get:
      summary: Exchange a one-time auth bridge code and redirect
      parameters:
        - in: query
          name: code
          required: true
          schema: { type: string }
      responses:
        '303': { description: Session, activation grant or device credential issued }
        '401': { description: Access authentication or state missing }
  /auth/employee/login:
    post:
      summary: Employee PIN login bound to an ACTIVE POS device
      responses:
        '200': { description: Employee session created }
        '401': { description: Device or credentials invalid }
  /version:
    servers:
      - url: /api
    get:
      summary: Return release/build identity for runtime diagnostics
      responses:
        '200': { description: Environment, version, commit and build time }
  /device-activations/context:
    get:
      summary: Resolve the short-lived activation grant after Access authentication
      responses:
        '200': { description: Activation context and CSRF token }
  /device-activations/confirm:
    post:
      summary: Consume activation grant and create a POS device
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      responses:
        '201': { description: Device activated }
  /platform/stores:
    get: { summary: List stores, responses: { '200': { description: Store list } } }
    post: { summary: Create store and Owner, responses: { '201': { description: Created } } }
  /platform/stores/{storeId}:
    get: { summary: Get store details, responses: { '200': { description: Store details } } }
    delete:
      {
        summary: Delete store and all its data completely,
        responses: { '200': { description: Store deleted } },
      }
  /owner/staff:
    get: { summary: List employees, responses: { '200': { description: Employee list } } }
    post:
      {
        summary: Create employee with email,
        role and 4-digit PIN,
        responses: { '201': { description: Created } },
      }
  /owner/staff/bulk-action:
    post:
      summary: Activate, disable, delete or revoke sessions for selected employees
      responses:
        '200': { description: Bulk action completed }
  /owner/staff/{userId}:
    get: { summary: Get employee details, responses: { '200': { description: Employee details } } }
    put:
      {
        summary: Update employee name,
        email,
        role or PIN,
        responses: { '200': { description: Updated } },
      }
    delete:
      {
        summary: Disable and remove an employee from active use,
        responses: { '200': { description: Deleted } },
      }
  /owner/staff/{userId}/status:
    patch:
      summary: Enable or disable a non-Owner employee in the current store
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [ACTIVE, DISABLED] }
      responses:
        '200': { description: Employee status changed }
        '404': { description: Employee not found; Owner and cross-store users are not disclosed }
  /owner/staff/{userId}/pin:
    put:
      summary: Reset an employee PIN
      responses:
        '200': { description: PIN reset }
  /owner/staff/{userId}/sessions/revoke:
    post:
      summary: Revoke every active employee session
      responses:
        '200': { description: Sessions revoked }
  /owner/staff/roles:
    get: { summary: List store roles, responses: { '200': { description: Role list } } }
    post:
      {
        summary: Create a role with supported permission keys,
        responses: { '201': { description: Created } },
      }
  /owner/staff/roles/permissions:
    get:
      summary: Get the supported sales and store-management permission catalog
      responses:
        '200': { description: Permission catalog }
  /owner/staff/roles/{roleId}:
    get: { summary: Get role permissions, responses: { '200': { description: Role details } } }
    put:
      { summary: Update role name and permissions, responses: { '200': { description: Updated } } }
    delete:
      { summary: Delete an unused non-system role, responses: { '200': { description: Deleted } } }
  /owner/catalog/products:
    get: { summary: List products, responses: { '200': { description: Product list } } }
    post: { summary: Create product, responses: { '201': { description: Created } } }
  /owner/catalog/products/{productId}:
    get:
      summary: Get product details, variants and time pricing
      responses: { '200': { description: Product details } }
    put:
      summary: Update product, variants and avatar metadata
      responses: { '200': { description: Product updated } }
    delete:
      summary: Disable a product and its active variants
      responses: { '200': { description: Product disabled } }
  /owner/catalog/products/{productId}/restore:
    post:
      summary: Restore a disabled product and its variants
      responses: { '200': { description: Product restored } }
  /owner/catalog/pricing:
    put:
      summary: Save time-based pricing, first period and special-hour windows
      responses:
        '200': { description: Pricing updated }
        '422': { description: Invalid or overlapping pricing windows }
  /owner/catalog/categories:
    get:
      {
        summary: List categories with active product counts,
        responses: { '200': { description: Category list } },
      }
    post: { summary: Create a category, responses: { '201': { description: Created } } }
  /owner/catalog/categories/{categoryId}:
    put:
      summary: Rename a category
      responses: { '200': { description: Category updated } }
    delete:
      summary: Disable an empty category
      responses:
        '200': { description: Category disabled }
        '409': { description: Category still has active products }
  /owner/catalog/categories/{categoryId}/products:
    get:
      summary: List products assigned to a category
      parameters:
        - in: query
          name: q
          schema: { type: string }
      responses: { '200': { description: Products in category } }
  /owner/catalog/units:
    get:
      summary: List units with server-side search and pagination
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
        - in: query
          name: q
          schema: { type: string }
      responses: { '200': { description: Paginated unit list and active product usage count } }
    post: { summary: Create a unit, responses: { '201': { description: Created } } }
  /owner/catalog/units/{unitId}:
    get: { summary: Get a unit, responses: { '200': { description: Unit details } } }
    put: { summary: Rename a unit, responses: { '200': { description: Unit updated } } }
    delete:
      summary: Delete an unused unit
      responses:
        '200': { description: Unit deleted }
        '409': { description: Unit is used by active products }
  /owner/catalog/units/{unitId}/products:
    get:
      summary: List active products using a unit with server-side pagination
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
        - in: query
          name: q
          schema: { type: string }
      responses: { '200': { description: Paginated product usage list } }
  /owner/catalog/tables:
    post:
      summary: Create a service table with same-store ACTIVE area and TIME product references
      responses:
        '201': { description: Created business DTO }
        '422': { description: Invalid or cross-store references }
  /owner/catalog/area-layouts:
    get:
      summary: List active areas with their available or occupied tables/rooms
      responses:
        '200': { description: Nested area and table/room list }
    post:
      summary: Atomically create an area with at least one table/room
      responses:
        '201': { description: Area and table identifiers }
        '409': { description: Area name already exists }
        '422': { description: Area name or table/room list is invalid }
  /owner/catalog/tables/{tableId}:
    patch:
      summary: Rename a table/room (duplicate display names are allowed)
      responses:
        '200': { description: Table/room updated }
        '404': { description: Table/room not found in the current store }
    delete:
      summary: Remove an available table/room from active layouts
      responses:
        '200': { description: Table/room removed }
        '409': { description: Occupied table/room cannot be removed }
  /owner/catalog/tables/{tableId}/pricing:
    patch:
      summary: Assign an active time product and its pricing to an available table
      responses:
        '200': { description: Table pricing updated }
        '409': { description: Occupied table cannot change pricing }
        '422': { description: Time product has no pricing configuration }
  /owner/catalog/area-layouts/area-order:
    put:
      summary: Persist the display order of every active area in the store
      responses:
        '200': { description: Area display order updated }
        '422': { description: List is incomplete, duplicated or belongs to another store }
  /owner/catalog/area-layouts/{areaId}/table-order:
    put:
      summary: Persist the display order of every active table/room in an area
      responses:
        '200': { description: Display order updated }
        '422': { description: List is incomplete, duplicated or belongs to another area/store }
  /owner/catalog/area-layouts/{areaId}:
    delete:
      summary: Remove an area and all of its available tables/rooms from active layouts
      responses:
        '200': { description: Area and its available tables/rooms removed }
        '404': { description: Area not found in the current store }
        '409': { description: Area contains an occupied table/room }
  /owner/store/settings:
    put:
      summary: Update store settings, bank QR media and administrative location
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, address, businessDayCutoffMinutes]
              properties:
                name: { type: string, minLength: 1, maxLength: 160 }
                phone:
                  {
                    type: string,
                    nullable: true,
                    maxLength: 11,
                    pattern: '^(?:02\\d{8,9}|0[35789]\\d{8})$',
                    description: 'Số di động Việt Nam 10 số hoặc số bàn 10–11 số.',
                  }
                address: { type: string, minLength: 1, maxLength: 500 }
                provinceCode: { type: integer, minimum: 1, nullable: true }
                provinceName: { type: string, nullable: true }
                wardCode: { type: integer, minimum: 1, nullable: true }
                wardName: { type: string, nullable: true }
                businessDayCutoffMinutes: { type: integer, minimum: 0, maximum: 1439 }
                bankName: { type: string, nullable: true }
                bankAccountNumber: { type: string, nullable: true }
                bankAccountName: { type: string, nullable: true }
                bankQrMediaId: { type: string, format: uuid, nullable: true }
      responses:
        '200': { description: Settings updated }
        '404': { description: Bank QR media not found in current store }
  /owner/devices:
    get:
      {
        summary: List current-store POS devices,
        responses: { '200': { description: Device list } },
      }
  /owner/devices/{deviceId}/revoke:
    post:
      summary: Revoke a current-store POS device
      responses:
        '200': { description: Device revoked }
        '404': { description: Device not found in current store }
  /devices/current/revoke:
    post:
      summary: Revoke the current device only when its store matches the Owner session store
      responses:
        '200': { description: Current device revoked }
        '403': { description: Cross-store device cookie rejected without tenant disclosure }
  /pos/tables:
    get: { summary: List POS tables, responses: { '200': { description: Table list } } }
  /owner/qr-order/settings:
    get:
      summary: Get Owner QR Order location, cooldown, schedule and effective availability settings
      responses: { '200': { description: QR Order settings } }
    put:
      summary: Replace Owner QR Order location, cooldown and weekly sales schedule settings
      responses:
        '200': { description: QR Order settings updated }
        '422': { description: Invalid location, cooldown or overlapping sales windows }
  /owner/qr-order/sales-status:
    patch:
      summary: Pause or resume QR opening and ordering manually
      responses: { '200': { description: Effective QR sales availability updated } }
  /owner/qr-order/tables:
    get:
      summary: List tables with QR Order status and fixed QR path metadata
      responses: { '200': { description: QR table list } }
  /owner/qr-order/tables/bulk:
    patch:
      summary: Enable or disable QR Order for selected non-occupied tables
      responses:
        '200': { description: QR table states updated }
        '409': { description: At least one selected table is occupied }
  /owner/qr-order/tables/{tableId}:
    patch:
      summary: Enable or disable QR Order for one table without rotating its fixed token
      responses:
        '200': { description: QR table state updated }
        '409': { description: Occupied table cannot be disabled }
  /owner/qr-order/tables/{tableId}/qr-code:
    get:
      summary: Get or initialize the table fixed QR code
      responses: { '200': { description: Fixed QR path } }
  /owner/qr-order/menu:
    get:
      summary: List fixed-price active products eligible for QR ordering, including their Owner visibility state
      responses: { '200': { description: Read-only QR menu } }
  /owner/qr-order/menu/products/{productId}:
    patch:
      summary: Show or hide one eligible product in the guest QR menu
      responses:
        '200': { description: QR menu visibility updated }
        '404': { description: Product is not eligible in the current store }
  /owner/qr-order/menu/variants/{variantId}:
    patch:
      summary: Show or hide one eligible price variant in the guest QR menu
      responses:
        '200': { description: QR menu price-variant visibility updated }
        '404': { description: Price variant is not eligible in the current store }
  /owner/qr-order/quick-reasons:
    get:
      summary: List ordered Owner-configurable quick staff-call reasons
      responses: { '200': { description: Quick reasons } }
    put:
      summary: Replace up to twenty quick staff-call reasons
      responses:
        '200': { description: Quick reasons updated }
        '422': { description: Invalid or duplicate reasons }
  /pos/tables/open:
    post:
      {
        summary: Atomically open table and time session,
        responses: { '201': { description: Opened } },
      }
  /pos/orders/{orderId}/quote:
    get:
      summary: Server-authoritative order quote
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string, format: uuid }
      responses: { '200': { description: Quote } }
  /pos/orders/{orderId}/items:
    post:
      summary: Add an item using a server-authoritative price snapshot
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, quantityMilli, expectedOrderVersion]
              properties:
                productId: { type: string, format: uuid }
                variantId: { type: string, format: uuid, nullable: true }
                quantityMilli: { type: integer, minimum: 1 }
                expectedOrderVersion: { type: integer, minimum: 1 }
                enteredUnitPriceVnd:
                  { type: integer, minimum: 0, description: Required only for promptPrice variants }
                discount:
                  type: object
                  required: [type, value]
                  properties:
                    type: { type: string, enum: [FIXED, PERCENT] }
                    value: { type: integer, minimum: 0 }
                  nullable: true
      responses:
        '201': { description: Item added and price/discount snapshotted }
        '403': { description: discount.apply required when discount is present }
        '422': { description: Prompt-price or discount validation failed }
  /pos/orders/{orderId}/time/pause:
    post:
      summary: Atomically pause a running time session
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      responses:
        '200': { description: Paused }
        '409': { description: Stale version or invalid state }
  /pos/orders/{orderId}/time/resume:
    post:
      summary: Atomically resume a paused time session
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      responses:
        '200': { description: Resumed }
        '409': { description: Stale version or invalid state }
  /pos/orders/{orderId}/checkout:
    post:
      summary: Atomic and idempotent checkout
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      responses:
        '200': { description: Payment and invoice created }
        '409': { description: Version conflict or already paid }
